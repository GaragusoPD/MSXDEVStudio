appId: com.msxstudio.app
productName: MSXStudio
directories:
  buildResources: build
  output: dist
files:
  # A *positive* pattern here replaces electron-builder's default `**/*`, so
  # everything the app needs has to be listed. `out/` is the compiled app
  # itself — without it the asar has no entry point and packaging fails.
  - 'out/**'
  - 'package.json'
  - 'licenses/**'
  # Help ▸ Documentation reads these out of the asar over the `docs://` scheme
  # (see main/services/docs.ts), so the guides and tutorials work offline.
  # Listed explicitly rather than left to the default glob: it is ~2.6 MB, most
  # of it screenshots, and that should be a decision rather than an accident.
  - 'docs/**'
  - '!**/.vscode/*'
  - '!src/*'
  - '!specs/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mjs,cjs}'
  - '!eslint.config.{js,mjs,cjs}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.editorconfig,.gitignore}'
asarUnpack:
  - resources/**

# The demo games ship as plain files beside the asar rather than inside it:
# "Install demo projects" is then an ordinary recursive copy into a folder the
# user picks (see main/services/demos.ts). `out/` and `emul/` are build output
# — excluding them keeps this to ~2 MB, and avoids shipping a prebuilt ROM that
# could mask a broken toolchain.
extraResources:
  - from: demo_msx1
    to: demos/demo_msx1
    filter: ['**/*', '!out/**', '!emul/**', '!.msxstudio/**']
  - from: demo_msx2
    to: demos/demo_msx2
    filter: ['**/*', '!out/**', '!emul/**', '!.msxstudio/**']

# No code signing (no certificates yet) and no auto-update (YAGNI pre-users) —
# see README's "Known gaps" section.
fileAssociations:
  - ext: msxproj
    name: MSX Studio Project
    description: MSX Studio project file
    # Linux .desktop/MimeType + shared-mime-info registration keys off this;
    # Windows NSIS registers the extension directly and uses the app's own
    # icon (electron-builder default) since no per-association icon is set.
    mimeType: application/x-msxstudio-project
    role: Editor

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  artifactName: ${name}-${version}-setup.${ext}
  createDesktopShortcut: always

portable:
  artifactName: ${name}-${version}-portable.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  synopsis: Desktop IDE for MSX game development
  syncDesktopName: true

appImage:
  artifactName: ${name}-${version}.${ext}

deb:
  artifactName: ${name}-${version}.${ext}

npmRebuild: false
publish: null
