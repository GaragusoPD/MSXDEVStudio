<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>MSXStudio</title>
    <!--
      `docs:` is the bundled documentation, served out of the asar by the main
      process (see main/services/docs.ts). It is listed for `connect-src` (the
      viewer fetches each page's markdown) and `img-src` (the screenshots in
      them). Nothing else may be loaded from it, and no remote origin is added.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: docs:; font-src 'self' data:; connect-src 'self' docs:"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
